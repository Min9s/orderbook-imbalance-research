name: Public code and aggregate verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install public package and test dependencies
        run: python -m pip install '.[dev]'
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Verify published aggregate consistency
        run: python examples/verify_public_results.py
      - name: Check dependencies
        run: python -m pip check
      - name: Confirm recorded research artifacts were not rewritten
        run: git diff --exit-code

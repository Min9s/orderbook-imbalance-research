[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderbook-imbalance-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pyarrow>=20,<26", "scikit-learn>=1.6,<2", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
